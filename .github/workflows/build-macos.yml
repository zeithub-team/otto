name: Build macOS app

# Builds zeithub.otto for macOS (Apple Silicon and Intel) on a GitHub macOS runner:
# a .dmg and a .zip per architecture. A .dmg cannot be built on Windows.
#
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.1.9: on a tag the
# files are also attached to that GitHub release (created by `npm run release -- <v> --publish`).
#
# The app is not signed or notarized (that needs an Apple Developer account, $99/year), so on
# first launch macOS says it cannot verify the developer: right-click the app → Open, or
# System Settings → Privacy & Security → Open Anyway.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        # some tests describe Windows behaviour (PowerShell, winget): report, do not block the build
        continue-on-error: true
        run: npm test -w @otto/desktop

      - name: Build app
        run: npm run dist:mac -w @otto/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: zeithub-otto-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the release is created by the release script right after the tag is pushed
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" apps/desktop/release/*.dmg apps/desktop/release/*.zip --clobber
